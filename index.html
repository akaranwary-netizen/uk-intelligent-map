<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#081018" />
  <title>UK Intelligent Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="https://unpkg.com/cesium@1.132.0/Build/Cesium/Widgets/widgets.css" />

  <style>
    *{box-sizing:border-box}
    html,body,#app{height:100%;margin:0}
    body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#081018;color:#fff;overflow:hidden}
    #map2d,#map3d{position:absolute;inset:0}
    #map3d{display:none}
    .topbar{position:absolute;z-index:1000;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:center;pointer-events:none}
    .brand,.control,.search{pointer-events:auto;background:rgba(7,15,23,.88);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
    .brand{border-radius:14px;padding:10px 12px;min-width:max-content}
    .brand b{font-size:13px;letter-spacing:.08em}.brand small{display:block;color:#9fb0bd;font-size:10px;margin-top:2px}
    .search{flex:1;display:flex;border-radius:14px;overflow:hidden;max-width:540px}
    .search input{min-width:0;width:100%;border:0;outline:0;background:transparent;color:white;padding:12px;font-size:16px}
    button{font:inherit;color:white}
    .control{border-radius:12px;border:1px solid rgba(255,255,255,.14);padding:10px 12px;cursor:pointer}
    .control.active{background:#fff;color:#071019}
    .mode{position:absolute;z-index:1000;right:12px;top:76px;display:flex;gap:6px;background:rgba(7,15,23,.88);padding:5px;border-radius:14px;border:1px solid rgba(255,255,255,.14)}
    .mode button{border:0;background:transparent;padding:10px 12px;border-radius:10px}
    .mode button.active{background:#fff;color:#071019}
    .locate{position:absolute;z-index:1000;right:14px;bottom:max(24px,calc(env(safe-area-inset-bottom) + 14px));width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(7,15,23,.92);font-size:22px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
    .status{position:absolute;z-index:1000;left:12px;bottom:max(18px,calc(env(safe-area-inset-bottom) + 10px));max-width:calc(100% - 90px);background:rgba(7,15,23,.88);border:1px solid rgba(255,255,255,.14);padding:9px 12px;border-radius:12px;font-size:12px;color:#c7d3dc}
    .leaflet-control-attribution{font-size:9px}
    .cesium-viewer-bottom,.cesium-viewer-toolbar,.cesium-viewer-animationContainer,.cesium-viewer-timelineContainer,.cesium-viewer-fullscreenContainer{display:none!important}
    @media(max-width:620px){.brand small{display:none}.brand{padding:11px 9px}.brand b{font-size:10px}.topbar{gap:6px}.search input{padding:10px}.control{padding:10px}.mode{top:68px}}
  </style>
</head>
<body>
<div id="app">
  <div id="map2d"></div>
  <div id="map3d"></div>

  <div class="topbar">
    <div class="brand"><b>UK INTELLIGENT MAP</b><small>Free map foundation</small></div>
    <form class="search" id="searchForm">
      <input id="searchInput" placeholder="Search a UK place…" autocomplete="off" />
    </form>
  </div>

  <div class="mode">
    <button id="navBtn" class="active" type="button">Navigation</button>
    <button id="threeBtn" type="button">3D</button>
  </div>

  <button class="locate" id="locateBtn" aria-label="Use my location">⌖</button>
  <div class="status" id="status">Navigation map ready. Tap ⌖ to use your real device location.</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/cesium@1.132.0/Build/Cesium/Cesium.js"></script>
<script>
(() => {
  const DEFAULT = {lat:54.5, lon:-3.2, zoom:6};
  const status = document.getElementById('status');
  const map2dEl = document.getElementById('map2d');
  const map3dEl = document.getElementById('map3d');
  const navBtn = document.getElementById('navBtn');
  const threeBtn = document.getElementById('threeBtn');
  let mode='2d', cesium=null, user2d=null, user3d=null, lastLocation=null;

  const map = L.map('map2d',{zoomControl:false}).setView([DEFAULT.lat,DEFAULT.lon],DEFAULT.zoom);
  L.control.zoom({position:'bottomleft'}).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);

  function ensureCesium(){
    if(cesium) return;
    Cesium.Ion.defaultAccessToken = undefined;
    cesium = new Cesium.Viewer('map3d',{
      animation:false,timeline:false,baseLayerPicker:false,geocoder:false,homeButton:false,
      sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,infoBox:false,
      selectionIndicator:false,terrainProvider:new Cesium.EllipsoidTerrainProvider(),
      baseLayer:false
    });
    const imagery = new Cesium.OpenStreetMapImageryProvider({url:'https://tile.openstreetmap.org/'});
    cesium.imageryLayers.addImageryProvider(imagery);
    cesium.scene.globe.depthTestAgainstTerrain=false;
  }

  function leafletCenter(){
    const c=map.getCenter();
    return {lat:c.lat,lon:c.lng,zoom:map.getZoom()};
  }

  function zoomToHeight(z){
    return Math.max(120, 18000000/Math.pow(2,z));
  }

  function heightToZoom(h){
    return Math.max(2,Math.min(19,Math.log2(18000000/Math.max(h,120))));
  }

  function switch3d(){
    const p=leafletCenter();
    ensureCesium();
    mode='3d'; map2dEl.style.display='none'; map3dEl.style.display='block';
    navBtn.classList.remove('active'); threeBtn.classList.add('active');
    cesium.resize();
    cesium.camera.flyTo({
      destination:Cesium.Cartesian3.fromDegrees(p.lon,p.lat,zoomToHeight(p.zoom)),
      orientation:{heading:0,pitch:Cesium.Math.toRadians(-55),roll:0},
      duration:.7
    });
    status.textContent='3D mode ready — drag to rotate, pinch to zoom. No Google billing required.';
  }

  function switch2d(){
    if(cesium){
      const carto=Cesium.Cartographic.fromCartesian(cesium.camera.positionWC);
      map.setView(
        [Cesium.Math.toDegrees(carto.latitude),Cesium.Math.toDegrees(carto.longitude)],
        Math.round(heightToZoom(carto.height))
      );
    }
    mode='2d'; map3dEl.style.display='none'; map2dEl.style.display='block';
    threeBtn.classList.remove('active'); navBtn.classList.add('active');
    setTimeout(()=>map.invalidateSize(),50);
    status.textContent='Navigation mode ready.';
  }

  navBtn.addEventListener('click',switch2d);
  threeBtn.addEventListener('click',switch3d);

  function showLocation(lat,lon,accuracy){
    lastLocation={lat,lon};
    if(user2d) user2d.remove();
    user2d=L.circleMarker([lat,lon],{radius:9,weight:3,color:'#fff',fillColor:'#168cff',fillOpacity:1}).addTo(map);
    L.circle([lat,lon],{radius:Math.min(accuracy||20,1000),weight:1,opacity:.4,fillOpacity:.08}).addTo(map);
    map.setView([lat,lon],16);
    if(cesium){
      if(user3d) cesium.entities.remove(user3d);
      user3d=cesium.entities.add({
        position:Cesium.Cartesian3.fromDegrees(lon,lat,5),
        point:{pixelSize:15,color:Cesium.Color.DODGERBLUE,outlineColor:Cesium.Color.WHITE,outlineWidth:3}
      });
      if(mode==='3d') cesium.camera.flyTo({
        destination:Cesium.Cartesian3.fromDegrees(lon,lat,900),
        orientation:{heading:0,pitch:Cesium.Math.toRadians(-55),roll:0},duration:.8
      });
    }
    status.textContent='Location found on your device'+(accuracy?` (accuracy about ${Math.round(accuracy)} m).` : '.');
  }

  document.getElementById('locateBtn').addEventListener('click',()=>{
    if(!navigator.geolocation){status.textContent='This browser does not support location.';return;}
    status.textContent='Requesting your location…';
    navigator.geolocation.getCurrentPosition(
      p=>showLocation(p.coords.latitude,p.coords.longitude,p.coords.accuracy),
      e=>{
        const msg=e.code===1?'Location permission was denied. Allow Location for this website in Safari settings.':
                  e.code===2?'Your device could not determine its location.':'Location request timed out. Try again.';
        status.textContent=msg;
      },
      {enableHighAccuracy:true,timeout:15000,maximumAge:10000}
    );
  });

  document.getElementById('searchForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const q=document.getElementById('searchInput').value.trim();
    if(!q) return;
    status.textContent='Searching…';
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gb&q='+encodeURIComponent(q),{
        headers:{'Accept':'application/json'}
      });
      const a=await r.json();
      if(!a.length){status.textContent='No UK place found for that search.';return;}
      const lat=Number(a[0].lat),lon=Number(a[0].lon);
      if(mode==='2d') map.setView([lat,lon],15);
      else {
        ensureCesium();
        cesium.camera.flyTo({
          destination:Cesium.Cartesian3.fromDegrees(lon,lat,1200),
          orientation:{heading:0,pitch:Cesium.Math.toRadians(-55),roll:0},duration:.8
        });
      }
      status.textContent=a[0].display_name;
    }catch(err){status.textContent='Search is temporarily unavailable.';}
  });
})();
</script>
</body>
</html>
