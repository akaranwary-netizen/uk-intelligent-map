<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UK Intelligent Map</title><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://unpkg.com"><link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet"><script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.124/Cesium.js"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/cesium/1.124/Widgets/widgets.min.css" rel="stylesheet"></head><body>
<div id="app"><div id="navMap"></div><div id="threeMap"></div><header><div class="brand"><span>🇬🇧</span><div><b>UK INTELLIGENT MAP</b><small>Maps • Live Data • AI Assistant</small></div></div><div class="search">⌕ <input id="search" placeholder="Search a place, address or ask AI…"></div><button id="askTop" class="ask">🎙 Ask AI</button></header>
<div class="modes"><button class="mode active" data-mode="nav">🗺 Navigation Map <small>Clean, fast, live traffic style</small></button><button class="mode" data-mode="3d">⬡ 3D Realistic Map <small>Buildings, satellite & terrain</small></button></div>
<nav class="layers"><button data-layer="cctv">📹<span>CCTV</span></button><button data-layer="traffic" class="on">🚗<span>Traffic</span></button><button data-layer="speed">📸<span>Speed</span></button><button data-layer="trains">🚆<span>Trains</span></button><button data-layer="buses">🚌<span>Buses</span></button><button data-layer="flights">✈️<span>Flights</span></button><button data-layer="parking">🅿️<span>Parking</span></button></nav>
<div class="right"><button id="locate">📍</button><button id="zoomIn">＋</button><button id="zoomOut">−</button></div>
<section id="info" class="info"><b>Welcome to UK Intelligent Map</b><span>Ask: “Show me CCTV near me” or “Traffic on the M5”.</span></section>
<footer><button id="mic">🎙</button><div><b id="voiceTitle">Tap to speak</b><small id="voiceSub">“Show me CCTV near me” &nbsp; • &nbsp; “Traffic on M5” &nbsp; • &nbsp; “Take me to Birmingham”</small></div><button id="lang">EN | کوردی</button></footer></div><script src="app.js?v=20260917-0056"></script></body></html>
